const KEY='ruta_madrid_pda_v1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=(p='id')=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let state=load();
let currentClient=state.clients[0]?.id||null, productQuery='', category='Todos', homeShowAll=false, clientStatusFilter='all', deliveryMode='focus', deliveryFocusIndex=0;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x?.clients&&x?.products){x.delivered=x.delivered||{};x.loaded=x.loaded||{};x.purchasedQty=x.purchasedQty||{};x.history=x.history||[];x.habitual=x.habitual||{};return x}}catch(e){}return {date:today(),clients:structuredClone(INITIAL.clients),products:structuredClone(INITIAL.products),orders:{},status:{},purchased:{},purchasedQty:{},delivered:{},loaded:{},history:[],habitual:{}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function qty(v){return Number(v||0).toLocaleString('es-ES',{maximumFractionDigits:2})}
function order(id){return state.orders[id]||(state.orders[id]={})}
function lines(id){return Object.entries(order(id)).filter(([,v])=>Number(v)>0).map(([pid,q])=>({p:state.products.find(x=>x.id===pid),q:Number(q)})).filter(x=>x.p)}
function totals(){const m={};state.clients.forEach(c=>lines(c.id).forEach(({p,q})=>{const k=p.name+'__'+p.unit;m[k]||(m[k]={p,q:0,clients:[]});m[k].q+=q;m[k].clients.push({name:c.name,q})}));return Object.values(m).sort((a,b)=>a.p.name.localeCompare(b.p.name,'es'))}
function setView(v){$$('.view').forEach(x=>x.classList.toggle('active',x.id===v));$$('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render()}
function statusText(c){const s=state.status[c.id];if(s==='done')return 'Pedido hecho';if(s==='skip')return 'No compra';return 'Pendiente'}
function render(){
 $('#today').textContent=new Date(state.date+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
 renderHome();renderClients();renderOrder();renderBuy();renderLoad();renderDelivery();
}
function renderHome(){
 const done=state.clients.filter(c=>state.status[c.id]==='done').length, skip=state.clients.filter(c=>state.status[c.id]==='skip').length;
 const pendingClients=state.clients.filter(c=>!state.status[c.id]).sort((a,b)=>a.routeOrder-b.routeOrder);
 const pending=pendingClients.length, t=totals(), totalQty=t.reduce((a,x)=>a+x.q,0);
 const visible=homeShowAll?pendingClients:pendingClients.slice(0,6);
 $('#home').innerHTML=`<article class="card hero"><h2>Ruta del día</h2><p>Recoge pedidos, suma la compra y prepara el reparto.</p><div class="stats"><div class="stat"><b>${state.clients.length}</b><span>Clientes</span></div><div class="stat"><b>${done}</b><span>Hechos</span></div><div class="stat"><b>${pending}</b><span>Pendientes</span></div><div class="stat"><b>${qty(totalQty)}</b><span>Unidades totales</span></div></div><div class="actions"><button class="btn primary" onclick="setView('order')">Continuar pedidos</button><button class="btn soft" onclick="setView('buy')">Ver compra total</button></div></article>
 <article class="card"><div class="section-title"><div><h2>Clientes pendientes</h2><div class="muted">${pending} pendientes</div></div><button class="btn soft small" onclick="setView('clients')">Ver todos</button></div>
 <div class="client-list-wrap"><div class="client-grid">${visible.map(clientCard).join('')||'<div class="empty">Ruta completada</div>'}</div></div>
 ${pending>6?`<button class="btn soft show-all-btn" onclick="homeShowAll=!homeShowAll;renderHome()">${homeShowAll?'Mostrar menos':'Mostrar los '+pending+' pendientes'}</button>`:''}
 <div class="mobile-note">En móvil puedes deslizar esta lista y también abrir la pestaña Clientes.</div></article>`;
}
function clientCard(c){
 const n=lines(c.id).length,s=state.status[c.id]||'pending';
 return `<div class="client"><div class="num">${c.routeOrder}</div><div class="client-main"><b>${esc(c.name)}</b><span class="badge ${s}">${statusText(c)}</span> <span class="badge">${n} productos</span></div><button class="btn primary small" onclick="openClient('${c.id}')">Abrir</button></div>`
}
function renderClients(){
 $('#clients').innerHTML=`<article class="card"><div class="section-title"><div><h2>Todos los clientes</h2><div class="muted">${state.clients.length} clientes cargados</div></div><button class="btn primary small" onclick="clientForm()">+ Cliente</button></div>
 <div class="client-tools"><input class="search" id="clientSearch" placeholder="Buscar cliente…" oninput="renderClientFiltered(this.value)"><button class="btn soft" onclick="document.getElementById('clientSearch').value='';renderClientFiltered('')">Limpiar</button></div>
 <div class="client-filters">
  <button class="client-filter ${clientStatusFilter==='all'?'active':''}" onclick="clientStatusFilter='all';renderClientFiltered(document.getElementById('clientSearch')?.value||'')">Todos</button>
  <button class="client-filter ${clientStatusFilter==='pending'?'active':''}" onclick="clientStatusFilter='pending';renderClientFiltered(document.getElementById('clientSearch')?.value||'')">Pendientes</button>
  <button class="client-filter ${clientStatusFilter==='done'?'active':''}" onclick="clientStatusFilter='done';renderClientFiltered(document.getElementById('clientSearch')?.value||'')">Hechos</button>
  <button class="client-filter ${clientStatusFilter==='skip'?'active':''}" onclick="clientStatusFilter='skip';renderClientFiltered(document.getElementById('clientSearch')?.value||'')">No compra</button>
 </div>
 <div class="client-list-wrap"><div class="client-grid" id="clientGrid">${filteredClients('').map(clientCard).join('')}</div></div>
 <div class="mobile-note">Desliza para ver todos los clientes. No hay límite de resultados.</div></article>`;
}
function filteredClients(q=''){
 q=String(q).trim().toUpperCase();
 return state.clients
  .filter(c=>!q||c.name.includes(q))
  .filter(c=>{
   const s=state.status[c.id]||'pending';
   return clientStatusFilter==='all'||s===clientStatusFilter;
  })
  .sort((a,b)=>a.routeOrder-b.routeOrder);
}
function renderClientFiltered(q){
 const list=filteredClients(q);
 $('#clientGrid').innerHTML=list.map(clientCard).join('')||'<div class="empty">No se encontraron clientes</div>';
}
function renderOrder(){
 const c=state.clients.find(x=>x.id===currentClient)||state.clients[0];if(!c)return;
 const cats=['Todos',...new Set(state.products.map(p=>p.category))];
 let ps=visibleProducts();
 $('#order').innerHTML=`<article class="card"><div class="section-title"><div><h2>Tomar pedido</h2><div class="muted">Solo toca + y −</div></div><button class="btn soft small" onclick="productForm()">+ Producto</button></div>
 <div class="muted" style="margin-bottom:6px">Selecciona cualquiera de los ${state.clients.length} clientes</div><select class="search" onchange="currentClient=this.value;render()" style="margin-bottom:8px">${state.clients.sort((a,b)=>a.routeOrder-b.routeOrder).map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.routeOrder}. ${esc(x.name)}</option>`).join('')}</select>
 <div class="order-quick-actions"><button class="btn soft" onclick="repeatLastOrder(\'${c.id}\')">Repetir último pedido</button><button class="btn soft" onclick="loadHabitual(\'${c.id}\')">Cargar habitual</button></div><div class="product-toolbar"><input id="productSearch" class="search" placeholder="Buscar producto…" value="${esc(productQuery)}" oninput="filterProductsLive(this.value)"><button class="btn soft" onclick="clearProductSearch()">Limpiar</button></div>
 <div class="cats">${cats.map(x=>`<button class="chip ${x===category?'active':''}" onclick="category='${esc(x)}';renderOrder()">${esc(x)}</button>`).join('')}</div></article>
 <article class="card"><div class="section-title"><div><h2>${esc(c.name)}</h2><div class="muted">${lines(c.id).length} productos añadidos</div></div><button class="btn warn small" onclick="markSkip('${c.id}')">No compra</button></div>
 <div class="product-list" id="productList">${ps.map(p=>productRow(c,p)).join('')}</div>
 <div class="actions"><button class="btn primary" onclick="finishClient('${c.id}')">Guardar pedido</button><button class="btn dark" onclick="shareClient('${c.id}')">Enviar WhatsApp</button></div></article>`;
}

function visibleProducts(){return state.products.filter(p=>p.active!==false&&(!productQuery||p.name.includes(productQuery.toUpperCase()))&&(category==='Todos'||p.category===category))}
function filterProductsLive(v){productQuery=String(v||'');const c=state.clients.find(x=>x.id===currentClient)||state.clients[0],list=document.getElementById('productList');if(!c||!list)return;const ps=visibleProducts();list.innerHTML=ps.length?ps.map(p=>productRow(c,p)).join(''):'<div class="empty">No se encontraron productos</div>'}
function clearProductSearch(){productQuery='';const i=document.getElementById('productSearch');if(i){i.value='';i.focus()}filterProductsLive('')}
function repeatLastOrder(cid){const h=(state.history||[]).find(x=>x.orders&&x.orders[cid]&&Object.values(x.orders[cid]).some(v=>Number(v)>0));if(!h){alert('No hay un pedido anterior guardado para este cliente');return}state.orders[cid]=structuredClone(h.orders[cid]);save()}
function loadHabitual(cid){const h=state.habitual?.[cid];if(h&&Object.values(h).some(v=>Number(v)>0)){state.orders[cid]=structuredClone(h);save();return}const cur=order(cid);if(Object.values(cur).some(v=>Number(v)>0)){state.habitual=state.habitual||{};state.habitual[cid]=structuredClone(cur);save();alert('Pedido actual guardado como habitual')}else alert('Añade primero productos para guardar un pedido habitual')}

function productRow(c,p){const q=Number(order(c.id)[p.id]||0);return `<div class="product touch-row" onclick="showProductDetail('${p.id}')"><div class="product-top"><div class="product-name">${esc(p.name)}<div class="unit">${esc(p.category)} · ${esc(p.unit)} · pulsa para ver quién lo pidió</div></div><div class="qty" onclick="event.stopPropagation()"><button onclick="bump('${c.id}','${p.id}',-1)">−</button><input inputmode="decimal" value="${q||''}" onchange="setQty('${c.id}','${p.id}',this.value)"><button onclick="bump('${c.id}','${p.id}',1)">+</button></div></div></div>`}
function bump(cid,pid,d){order(cid)[pid]=Math.max(0,Number(order(cid)[pid]||0)+d);save()}
function setQty(cid,pid,v){v=Number(String(v).replace(',','.'))||0;order(cid)[pid]=Math.max(0,v);save()}
function finishClient(id){state.status[id]='done';const idx=state.clients.findIndex(c=>c.id===id);currentClient=state.clients.slice(idx+1).find(c=>!state.status[c.id])?.id||id;save();setView('home')}
function markSkip(id){state.status[id]='skip';state.orders[id]={};save();setView('home')}
function renderBuy(){
 const t=totals();
 const shortages=t.filter(x=>Number(state.purchasedQty[x.p.id]??x.q)<x.q).length;
 $('#buy').innerHTML=`<article class="card"><div class="section-title"><div><h2>Compra real</h2><div class="muted">${t.length} productos · ${shortages} con faltante</div></div></div><div class="actions"><button class="btn primary" onclick="shareBuy()">Enviar compra</button><button class="btn soft" onclick="copyText(buyText())">Copiar texto</button></div></article><article class="card">${t.length?t.map(x=>{const bought=Number(state.purchasedQty[x.p.id]??x.q),diff=bought-x.q,diffText=diff===0?'<span class="ok">Correcto</span>':diff<0?`<span class="shortage">Faltan ${qty(Math.abs(diff))}</span>`:`<span class="surplus">Sobran ${qty(diff)}</span>`;return `<div class="buy-line touch-row" onclick="showProductDetail('${x.p.id}')"><div><div class="big-name">${esc(x.p.name)}</div><div class="muted">${x.clients.length} clientes · pedido ${qty(x.q)} ${esc(x.p.unit)}</div><div>${diffText}</div></div><div class="right" onclick="event.stopPropagation()"><label class="muted">Comprado</label><input style="width:82px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px;font-weight:800" inputmode="decimal" value="${qty(bought)}" onchange="setPurchasedQty('${x.p.id}',this.value)"><div class="muted">${esc(x.p.unit)}</div></div></div>`}).join(''):'<div class="empty">Todavía no hay pedidos</div>'}</article>`;
}
function setPurchasedQty(pid,v){v=Number(String(v).replace(',','.'))||0;state.purchasedQty[pid]=Math.max(0,v);save()}
function buyText(){const t=totals();return `LISTA DE COMPRA MADRID · ${fmtDate()}\n\n`+t.map(x=>`${x.p.name}: ${qty(x.q)} ${x.p.unit}`).join('\n')}
function clientText(id){const c=state.clients.find(x=>x.id===id),l=lines(id);return `PEDIDO ${c.name} · ${fmtDate()}\n\n`+l.map(x=>`${x.p.name}: ${qty(x.q)} ${x.p.unit}`).join('\n')}
function fmtDate(){return new Date(state.date+'T12:00').toLocaleDateString('es-ES')}
function shareText(text){if(navigator.share)navigator.share({text}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}
function shareBuy(){shareText(buyText())} function shareClient(id){shareText(clientText(id))}
async function copyText(t){try{await navigator.clipboard.writeText(t);alert('Texto copiado')}catch(e){prompt('Copia el texto:',t)}}

function renderLoad(){
 const t=totals(),pending=t.filter(x=>!state.loaded[x.p.id]),done=t.filter(x=>state.loaded[x.p.id]),pct=t.length?Math.round(done.length/t.length*100):0;
 $('#load').innerHTML=`<article class="card"><div class="section-title"><div><h2>Carga de furgoneta</h2><div class="muted">${done.length} de ${t.length} productos cargados</div></div><button class="btn soft small" onclick="state.loaded={};save()">Reiniciar</button></div><div class="delivery-progress"><span style="width:${pct}%"></span></div><div class="muted" style="margin-top:7px">${pct}% completado</div></article><article class="card">${pending.length?`<div class="delivery-section-title"><h3>Pendientes de cargar</h3><span class="badge">${pending.length}</span></div>${pending.map(x=>loadRow(x,false)).join('')}`:''}${done.length?`<div class="delivery-section-title"><h3>Ya cargados</h3><span class="badge done">${done.length}</span></div>${done.map(x=>loadRow(x,true)).join('')}`:''}${!t.length?'<div class="empty">Todavía no hay compra</div>':''}</article>`;
}
function loadRow(x,done){const bought=Number(state.purchasedQty[x.p.id]??x.q);return `<div class="load-item ${done?'done':''}" onclick="state.loaded['${x.p.id}']=!state.loaded['${x.p.id}'];save()"><div class="delivery-check">${done?'✓':''}</div><div><div class="delivery-name big-name">${esc(x.p.name)}</div><div class="muted">${x.clients.length} clientes</div></div><div class="right"><b>${qty(bought)} ${esc(x.p.unit)}</b></div></div>`}
function deliveryKey(cid,pid){return cid+'__'+pid}
function isDelivered(cid,pid){return !!state.delivered[deliveryKey(cid,pid)]}
function toggleDelivered(cid,pid){state.delivered[deliveryKey(cid,pid)]=!state.delivered[deliveryKey(cid,pid)];save()}
function clientDeliveryStats(cid){const l=lines(cid),done=l.filter(x=>isDelivered(cid,x.p.id)).length;return {total:l.length,done,pending:l.length-done}}
function renderDelivery(){
 let routeClients=state.clients.filter(c=>lines(c.id).length>0).map(c=>({c,st:clientDeliveryStats(c.id)})).sort((a,b)=>{const r=x=>x.st.pending===0?2:(x.st.done>0?1:0);return r(a)-r(b)||a.c.routeOrder-b.c.routeOrder});
 const all=routeClients.flatMap(o=>lines(o.c.id).map(x=>({done:isDelivered(o.c.id,x.p.id)}))),doneCount=all.filter(x=>x.done).length,totalCount=all.length,pct=totalCount?Math.round(doneCount/totalCount*100):0;
 const head=`<article class="card"><div class="section-title"><div><h2>Reparto</h2><div class="muted">${doneCount} de ${totalCount} líneas descargadas</div></div><button class="btn soft small" onclick="if(confirm('¿Reiniciar marcas?')){state.delivered={};save()}">Reiniciar</button></div><div class="segmented"><button class="btn ${deliveryMode==='focus'?'dark':'soft'} small" onclick="deliveryMode='focus';renderDelivery()">Un cliente</button><button class="btn ${deliveryMode==='list'?'dark':'soft'} small" onclick="deliveryMode='list';renderDelivery()">Lista completa</button></div><div class="delivery-progress"><span style="width:${pct}%"></span></div><div class="muted" style="margin-top:7px">${pct}% completado · pendientes arriba, completados abajo</div></article>`;
 if(!routeClients.length){$('#delivery').innerHTML=head+'<article class="card"><div class="empty">Todavía no hay pedidos</div></article>';return}
 if(deliveryMode==='focus'){deliveryFocusIndex=Math.min(deliveryFocusIndex,routeClients.length-1);const {c,st}=routeClients[deliveryFocusIndex],pending=lines(c.id).filter(x=>!isDelivered(c.id,x.p.id)),done=lines(c.id).filter(x=>isDelivered(c.id,x.p.id));$('#delivery').innerHTML=head+`<article class="card focus-card"><div class="section-title"><div><h2>${c.routeOrder}. ${esc(c.name)}</h2><div class="muted">${st.done}/${st.total} productos bajados</div></div><button class="btn soft small" onclick="lines('${c.id}')"> </button><button class="btn soft small" onclick="markClientDelivered('${c.id}')">Todo bajado</button></div>${pending.length?`<div class="delivery-section-title"><h3>Pendientes</h3><span class="badge">${pending.length}</span></div>${pending.map(x=>deliveryRow(c,x,false)).join('')}`:''}${done.length?`<div class="delivery-section-title"><h3>Ya bajados</h3><span class="badge done">${done.length}</span></div>${done.map(x=>deliveryRow(c,x,true)).join('')}`:''}<div class="delivery-focus-nav"><button class="btn soft" onclick="deliveryFocusIndex=Math.max(0,deliveryFocusIndex-1);renderDelivery()">← Anterior</button><button class="btn primary" onclick="deliveryFocusIndex=Math.min(${routeClients.length-1},deliveryFocusIndex+1);renderDelivery()">Siguiente →</button></div></article>`}
 else{$('#delivery').innerHTML=head+routeClients.map(({c,st})=>{const pending=lines(c.id).filter(x=>!isDelivered(c.id,x.p.id)),done=lines(c.id).filter(x=>isDelivered(c.id,x.p.id)),cls=st.pending===0?'complete':st.done?'partial':'';return `<article class="card delivery-client-card ${cls}"><div class="section-title"><div><h2>${c.routeOrder}. ${esc(c.name)}</h2><div class="muted">${st.done}/${st.total} productos bajados</div></div><button class="btn soft small" onclick="markClientDelivered('${c.id}')">Todo bajado</button></div>${pending.length?`<div class="delivery-section-title"><h3>Pendientes</h3><span class="badge">${pending.length}</span></div>${pending.map(x=>deliveryRow(c,x,false)).join('')}`:''}${done.length?`<div class="delivery-section-title"><h3>Ya bajados</h3><span class="badge done">${done.length}</span></div>${done.map(x=>deliveryRow(c,x,true)).join('')}`:''}</article>`}).join('')}
}
function deliveryRow(c,x,done){return `<div class="delivery-item ${done?'done':''}" onclick="toggleDelivered('${c.id}','${x.p.id}')"><div class="delivery-check">${done?'✓':''}</div><div><div class="delivery-name big-name">${esc(x.p.name)}</div><div class="muted">${esc(x.p.unit)}</div></div><div class="right"><b>${qty(x.q)} ${esc(x.p.unit)}</b></div></div>`}
function markClientDelivered(cid){lines(cid).forEach(x=>state.delivered[deliveryKey(cid,x.p.id)]=true);save()}


function productUsers(pid){
 const p=state.products.find(x=>x.id===pid);
 return state.clients
   .map(c=>({c,q:Number(order(c.id)[pid]||0)}))
   .filter(x=>x.q>0)
   .sort((a,b)=>a.c.routeOrder-b.c.routeOrder);
}
function showProductDetail(pid){
 const p=state.products.find(x=>x.id===pid); if(!p)return;
 const users=productUsers(pid), total=users.reduce((a,x)=>a+x.q,0);
 const rows=users.length?users.map(x=>`<div class="product-client-row">
   <div><div class="big-name">${x.c.routeOrder}. ${esc(x.c.name)}</div><div class="muted">${statusText(x.c)}</div></div>
   <div class="client-qty-edit">
    <button onclick="detailBump('${x.c.id}','${pid}',-1)">−</button>
    <input inputmode="decimal" value="${qty(x.q)}" onchange="detailSet('${x.c.id}','${pid}',this.value)">
    <button onclick="detailBump('${x.c.id}','${pid}',1)">+</button>
   </div>
 </div>`).join(''):`<div class="empty">Ningún cliente tiene este producto</div>`;
 openModal('Detalle del producto',`<div class="product-detail-head"><h3>${esc(p.name)}</h3><div>${qty(total)} ${esc(p.unit)} · ${users.length} clientes</div></div>
 <div>${rows}</div>
 <div class="detail-actions">
  <button class="btn soft" onclick="copyText(productDetailText('${pid}'))">Copiar detalle</button>
  <button class="btn dark" onclick="shareText(productDetailText('${pid}'))">WhatsApp</button>
 </div>`);
}
function detailBump(cid,pid,d){
 order(cid)[pid]=Math.max(0,Number(order(cid)[pid]||0)+d);
 save();
 showProductDetail(pid);
}
function detailSet(cid,pid,v){
 v=Number(String(v).replace(',','.'))||0;
 order(cid)[pid]=Math.max(0,v);
 save();
 showProductDetail(pid);
}
function productDetailText(pid){
 const p=state.products.find(x=>x.id===pid), users=productUsers(pid);
 const total=users.reduce((a,x)=>a+x.q,0);
 return `${p.name} · ${qty(total)} ${p.unit}\n\n`+
   users.map(x=>`${x.c.name}: ${qty(x.q)} ${p.unit}`).join('\n');
}

function openClient(id){currentClient=id;setView('order')}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
function clientForm(){openModal('Añadir cliente',`<div class="form-grid"><div class="field"><label>Nombre</label><input id="cfName"></div><div class="field"><label>Orden</label><input id="cfOrder" type="number" value="${state.clients.length+1}"></div><div class="field"><label>Teléfono</label><input id="cfPhone"></div><div class="field"><label>Dirección</label><input id="cfAddress"></div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="addClient()">Guardar cliente</button>`)}
function addClient(){const n=$('#cfName').value.trim().toUpperCase();if(!n)return;state.clients.push({id:uid('c'),name:n,phone:$('#cfPhone').value,address:$('#cfAddress').value,routeOrder:Number($('#cfOrder').value)||state.clients.length+1,active:true});closeModal();save()}
function productForm(){openModal('Añadir producto',`<div class="form-grid"><div class="field"><label>Producto</label><input id="pfName"></div><div class="field"><label>Unidad</label><select id="pfUnit"><option>CAJA</option><option>MANOJO</option><option>UD</option><option>KG</option><option>SACO</option></select></div><div class="field" style="grid-column:1/-1"><label>Categoría</label><input id="pfCat" value="Otros"></div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="addProduct()">Guardar producto</button>`)}
function addProduct(){const n=$('#pfName').value.trim().toUpperCase();if(!n)return;state.products.push({id:uid('p'),name:n,unit:$('#pfUnit').value,category:$('#pfCat').value.trim()||'Otros',active:true});closeModal();save()}
function newRoute(){if(!confirm('¿Crear una ruta nueva? Se archivará la ruta actual en este dispositivo y se vaciarán cantidades.'))return;const backup=JSON.parse(localStorage.getItem('ruta_madrid_history')||'[]');backup.unshift({...state,savedAt:new Date().toISOString()});localStorage.setItem('ruta_madrid_history',JSON.stringify(backup.slice(0,20)));state.history=state.history||[];state.history.unshift({date:state.date,orders:structuredClone(state.orders)});state.history=state.history.slice(0,20);state.date=today();state.orders={};state.status={};state.purchased={};state.purchasedQty={};state.delivered={};state.loaded={};save()}
$$('.nav').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};$('#newRoute').onclick=newRoute;
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
