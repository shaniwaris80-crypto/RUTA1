<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Ruta Madrid Pro</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <h1>Ruta Madrid</h1>
    <p>Pedidos sincronizados en todos tus dispositivos.</p>
    <input id="loginEmail" type="email" value="shaniwaris80@gmail.com" autocomplete="email">
    <input id="loginPassword" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="loginButton" class="btn primary">Entrar</button>
    <button id="resetPasswordButton" class="btn soft">Recuperar contraseña</button>
    <div id="loginMessage" class="muted"></div>
  </div>
</div>

<div class="app">
  <header class="topbar">
    <div>
      <h1>🚚 Ruta Madrid</h1>
      <div id="routeDate" class="muted"></div>
      <span id="cloudStatus" class="cloud offline">● Sin conexión</span>
    </div>
    <button id="logoutButton" class="btn soft small">Salir</button>
  </header>

  <main>
    <section id="view-home" class="view active"></section>
    <section id="view-clients" class="view"></section>
    <section id="view-orders" class="view"></section>
    <section id="view-buy" class="view"></section>
    <section id="view-load" class="view"></section>
    <section id="view-delivery" class="view"></section>
  </main>
</div>

<nav class="bottom-nav">
  <button data-view="orders" class="nav active"><span>📝</span>Pedidos</button>
  <button data-view="buy" class="nav"><span>🛒</span>Compra</button>
  <button data-view="load" class="nav"><span>📦</span>Carga</button>
  <button data-view="delivery" class="nav"><span>🚚</span>Reparto</button>
  <button data-view="home" class="nav"><span>⋯</span>Más</button>
</nav>

<div id="modal" class="modal" aria-hidden="true">
  <div class="sheet">
    <div class="sheet-header">
      <h2 id="modalTitle"></h2>
      <button id="modalClose" class="btn soft small">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<input id="backupFileInput" type="file" accept="application/json" hidden>
<div id="toast" class="toast"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
