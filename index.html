<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Ruta Madrid PDA</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#16a34a;--danger:#dc2626;--warn:#d97706;--shadow:0 8px 26px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.app{max-width:1180px;margin:auto;padding:0 12px 92px}.top{position:sticky;top:0;z-index:20;background:rgba(243,245,249,.96);backdrop-filter:blur(12px);padding:10px 0}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand h1{font-size:20px;margin:0}.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.hero{background:linear-gradient(135deg,#111827,#0f766e);color:white}
.hero h2{margin:0 0 5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:rgba(255,255,255,.12);padding:10px;border-radius:13px}.stat b{display:block;font-size:21px}.stat span{font-size:11px}
.btn{border:0;border-radius:13px;padding:11px 13px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.dark{background:#111827;color:#fff}.soft{background:#eef2f7;color:#111827}.danger{background:#fee2e2;color:#991b1b}.small{padding:8px 10px;font-size:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.section-title h2{margin:0;font-size:18px}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.grid{display:grid;gap:9px}.client,.line{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:14px;background:#fff}
.client .num{width:34px;height:34px;border-radius:10px;background:#ecfdf5;color:#166534;display:grid;place-items:center;font-weight:800}.grow{flex:1}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#f3f4f6}.done{background:#dcfce7;color:#166534}
.product-list{display:grid;gap:8px}.product{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}.product-top{display:flex;align-items:center;gap:8px}.pname{font-weight:800;flex:1}.qty{display:flex;gap:6px;align-items:center}.qty button{width:42px;height:42px;border:0;border-radius:12px;background:#eef2f7;font-size:22px}.qty input{width:64px;height:42px;text-align:center;border:1px solid var(--line);border-radius:10px;font-weight:800}
.view{display:none}.view.active{display:block}.bottom{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:30;padding:7px}.nav{border:0;background:none;font-size:11px;font-weight:800;color:#6b7280}.nav span{display:block;font-size:19px}.nav.active{color:#15803d}
.cloud{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;background:#fee2e2;color:#991b1b}.cloud.online{background:#dcfce7;color:#166534}.cloud.sync{background:#fef3c7;color:#92400e}
.login{position:fixed;inset:0;background:linear-gradient(135deg,#111827,#0f766e);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.login.hidden{display:none}.login-card{width:min(430px,100%);background:#fff;border-radius:24px;padding:22px}.login-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.58);z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:white;width:100%;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}.sheet-head{display:flex;justify-content:space-between;align-items:center}
.delivery-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.check{width:34px;height:34px;border:2px solid #cbd5e1;border-radius:10px;display:grid;place-items:center}.delivery-item.checked{opacity:.58}.delivery-item.checked .check{background:#16a34a;color:white;border-color:#16a34a}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.product-list{grid-template-columns:1fr 1fr}.modal{align-items:center;justify-content:center}.sheet{max-width:760px;border-radius:22px}.login-card{padding:28px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.product-list{grid-template-columns:repeat(3,1fr)}}
@media(max-width:699px){.stats{grid-template-columns:1fr 1fr}.btn{min-height:44px}}
</style>
</head>
<body>
<div class="login" id="login"><div class="login-card">
<h2>Ruta Madrid</h2><p class="muted">Sincronización multidispositivo</p>
<input id="email" type="email" value="shaniwaris80@gmail.com" autocomplete="email">
<input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">
<div class="actions"><button class="btn primary" id="loginBtn">Entrar</button><button class="btn soft" id="resetBtn">Recuperar</button></div>
<div class="muted" id="loginMsg" style="margin-top:10px"></div>
</div></div>

<div class="app">
<header class="top"><div class="brand"><div><h1>🚚 RUTA MADRID</h1><div class="muted" id="routeDate"></div><span id="cloud" class="cloud">● Sin conexión</span></div><button class="btn soft small" id="logoutBtn">Salir</button></div></header>
<main>
<section id="home" class="view active"></section>
<section id="clients" class="view"></section>
<section id="orders" class="view"></section>
<section id="buy" class="view"></section>
<section id="load" class="view"></section>
<section id="delivery" class="view"></section>
</main>
</div>
<nav class="bottom">
<button class="nav active" data-view="home"><span>⌂</span>Inicio</button>
<button class="nav" data-view="clients"><span>👥</span>Clientes</button>
<button class="nav" data-view="orders"><span>📝</span>Pedidos</button>
<button class="nav" data-view="buy"><span>🛒</span>Compra</button>
<button class="nav" data-view="load"><span>📦</span>Carga</button>
<button class="nav" data-view="delivery"><span>🚚</span>Reparto</button>
</nav>
<div class="modal" id="modal"><div class="sheet"><div class="sheet-head"><h2 id="modalTitle"></h2><button class="btn soft small" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>

<script type="module">
import { firebaseConfig, workspaceId } from './firebase-config.js';
import { SEED } from './seed-data.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import { getAuth,onAuthStateChanged,signInWithEmailAndPassword,sendPasswordResetEmail,signOut,setPersistence,browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import { getDatabase,ref,onValue,set,update,get,serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js';

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
let data={catalog:{clients:{},products:{}},route:{date:today(),orders:{},status:{},purchasedQty:{},loaded:{},delivered:{},finalDelivered:{}}};
let currentClient=null,query='',category='Todos',applying=false,writeTimer=null;

function cloud(text,mode=''){const e=$('#cloud');e.textContent='● '+text;e.className='cloud '+mode}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function qty(v){return Number(v||0).toLocaleString('es-ES',{maximumFractionDigits:2})}
function clients(){return Object.values(data.catalog.clients||{}).filter(x=>x.active!==false).sort((a,b)=>a.routeOrder-b.routeOrder)}
function products(){return Object.values(data.catalog.products||{}).filter(x=>x.active!==false)}
function order(cid){return data.route.orders[cid]||(data.route.orders[cid]={})}
function lines(cid){return Object.entries(order(cid)).filter(([,q])=>Number(q)>0).map(([pid,q])=>({p:data.catalog.products[pid],q:Number(q)})).filter(x=>x.p)}
function totals(){const m={};clients().forEach(c=>lines(c.id).forEach(({p,q})=>{m[p.id]||(m[p.id]={p,q:0,clients:[]});m[p.id].q+=q;m[p.id].clients.push({c,q})}));return Object.values(m).sort((a,b)=>a.p.name.localeCompare(b.p.name,'es'))}
function save(){localStorage.setItem('rutaMadridV11',JSON.stringify(data));render();if(applying)return;clearTimeout(writeTimer);cloud('Sincronizando','sync');writeTimer=setTimeout(()=>set(ref(db,`workspaces/${workspaceId}`),{...data,updatedAt:serverTimestamp()}).then(()=>cloud('Sincronizado','online')).catch(()=>cloud('Error')),250)}
function seedIfNeeded(){
 const c=Object.keys(data.catalog.clients||{}).length,p=Object.keys(data.catalog.products||{}).length;
 if(!c)data.catalog.clients=structuredClone(SEED.clients);
 if(!p)data.catalog.products=structuredClone(SEED.products);
 if(!data.route)data.route={date:today(),orders:{},status:{},purchasedQty:{},loaded:{},delivered:{},finalDelivered:{}};
 save();
}
function routeReset(){
 if(!confirm('¿Crear una ruta nueva? Se borrarán pedidos, compra, carga y reparto actuales. Los clientes y productos se conservarán.'))return;
 data.route={date:today(),orders:{},status:{},purchasedQty:{},loaded:{},delivered:{},finalDelivered:{}};
 save();setView('home');
}
function setView(v){$$('.view').forEach(x=>x.classList.toggle('active',x.id===v));$$('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render()}
function render(){renderHome();renderClients();renderOrders();renderBuy();renderLoad();renderDelivery();$('#routeDate').textContent=new Date(data.route.date+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
function renderHome(){
 const cs=clients(),done=cs.filter(c=>data.route.status[c.id]==='done').length,pending=cs.length-done,t=totals();
 $('#home').innerHTML=`<article class="card hero"><h2>Ruta actual</h2><div class="stats"><div class="stat"><b>${cs.length}</b><span>Clientes</span></div><div class="stat"><b>${done}</b><span>Hechos</span></div><div class="stat"><b>${pending}</b><span>Pendientes</span></div><div class="stat"><b>${t.length}</b><span>Productos</span></div></div><div class="actions"><button class="btn primary" onclick="window.setView('orders')">Tomar pedidos</button><button class="btn soft" onclick="window.routeReset()">Nueva semana/ruta</button></div></article>
 <article class="card"><div class="section-title"><h2>Catálogo en la nube</h2></div><div class="line"><div class="grow"><b>${cs.length} clientes</b><div class="muted">Se conservan al limpiar ruta</div></div></div><div class="line"><div class="grow"><b>${products().length} productos</b><div class="muted">Se conservan al limpiar ruta</div></div></div></article>`;
}
function clientCard(c){const n=lines(c.id).length;return `<div class="client"><div class="num">${c.routeOrder}</div><div class="grow"><b>${esc(c.name)}</b><div><span class="badge">${n} productos</span></div></div><button class="btn primary small" onclick="window.openClient('${c.id}')">Abrir</button></div>`}
function renderClients(){
 $('#clients').innerHTML=`<article class="card"><div class="section-title"><div><h2>Clientes</h2><div class="muted">Guardados en Realtime Database</div></div><button class="btn primary small" onclick="window.addClientForm()">+ Cliente</button></div><input id="clientSearch" class="search" placeholder="Buscar cliente" oninput="window.filterClients(this.value)"><div id="clientGrid" class="grid" style="margin-top:10px">${clients().map(clientCard).join('')}</div></article>`;
}
function filterClients(v){const q=String(v).toUpperCase();$('#clientGrid').innerHTML=clients().filter(c=>c.name.includes(q)).map(clientCard).join('')}
function renderOrders(){
 const cs=clients();if(!currentClient)currentClient=cs[0]?.id;const c=data.catalog.clients[currentClient]||cs[0];if(!c)return;
 const cats=['Todos',...new Set(products().map(p=>p.category))];
 const ps=products().filter(p=>(!query||p.name.includes(query.toUpperCase()))&&(category==='Todos'||p.category===category));
 $('#orders').innerHTML=`<article class="card"><div class="section-title"><div><h2>Tomar pedido</h2><div class="muted">${cs.length} clientes disponibles</div></div><button class="btn soft small" onclick="window.addProductForm()">+ Producto</button></div><select class="search" onchange="window.selectClient(this.value)">${cs.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.routeOrder}. ${esc(x.name)}</option>`).join('')}</select><input id="productSearch" class="search" style="margin-top:8px" placeholder="Buscar producto" value="${esc(query)}" oninput="window.liveProductSearch(this.value)"><div style="display:flex;gap:7px;overflow:auto;padding:8px 0">${cats.map(x=>`<button class="btn ${x===category?'dark':'soft'} small" onclick="window.selectCategory('${esc(x)}')">${esc(x)}</button>`).join('')}</div></article><article class="card"><div class="section-title"><h2>${esc(c.name)}</h2><button class="btn primary small" onclick="window.finishClient('${c.id}')">Guardar pedido</button></div><div id="productList" class="product-list">${ps.map(p=>productRow(c,p)).join('')}</div></article>`;
}
function productRow(c,p){const q=Number(order(c.id)[p.id]||0);return `<div class="product"><div class="product-top"><div class="pname">${esc(p.name)}<div class="muted">${esc(p.unit)} · ${esc(p.category)}</div></div><div class="qty"><button onclick="window.bump('${c.id}','${p.id}',-1)">−</button><input inputmode="decimal" value="${q||''}" onchange="window.setQty('${c.id}','${p.id}',this.value)"><button onclick="window.bump('${c.id}','${p.id}',1)">+</button></div></div></div>`}
function liveProductSearch(v){query=String(v);const c=data.catalog.clients[currentClient]||clients()[0];const ps=products().filter(p=>(!query||p.name.includes(query.toUpperCase()))&&(category==='Todos'||p.category===category));$('#productList').innerHTML=ps.map(p=>productRow(c,p)).join('')||'<div class="muted">Sin resultados</div>'}
function bump(cid,pid,d){order(cid)[pid]=Math.max(0,Number(order(cid)[pid]||0)+d);save()}
function setQty(cid,pid,v){order(cid)[pid]=Math.max(0,Number(String(v).replace(',','.'))||0);save()}
function finishClient(cid){data.route.status[cid]='done';save();setView('home')}
function renderBuy(){
 const t=totals();$('#buy').innerHTML=`<article class="card"><div class="section-title"><h2>Compra real</h2></div>${t.map(x=>{const b=Number(data.route.purchasedQty[x.p.id]??x.q),d=b-x.q;return `<div class="line"><div class="grow"><b>${esc(x.p.name)}</b><div class="muted">Pedido ${qty(x.q)} ${esc(x.p.unit)} · ${x.clients.length} clientes</div><div class="${d<0?'danger':d>0?'done':''}">${d===0?'Correcto':d<0?'Faltan '+qty(Math.abs(d)):'Sobran '+qty(d)}</div></div><input style="width:82px;text-align:center;padding:9px;border:1px solid var(--line);border-radius:10px" value="${qty(b)}" onchange="window.setBought('${x.p.id}',this.value)"><button class="btn soft small" onclick="window.showProduct('${x.p.id}')">Repartir</button></div>`}).join('')||'<div class="muted">Sin pedidos</div>'}</article>`;
}
function setBought(pid,v){data.route.purchasedQty[pid]=Math.max(0,Number(String(v).replace(',','.'))||0);save()}
function finalQty(cid,pid){const k=cid+'__'+pid;return data.route.finalDelivered[k]===undefined?Number(order(cid)[pid]||0):Number(data.route.finalDelivered[k]||0)}
function showProduct(pid){const p=data.catalog.products[pid],req=clients().reduce((a,c)=>a+Number(order(c.id)[pid]||0),0),b=Number(data.route.purchasedQty[pid]??req);const rows=clients().filter(c=>Number(order(c.id)[pid]||0)>0||finalQty(c.id,pid)>0).map(c=>`<div class="line"><div class="grow"><b>${esc(c.name)}</b><div class="muted">Pedido ${qty(order(c.id)[pid]||0)}</div></div><div class="qty"><button onclick="window.bumpFinal('${c.id}','${pid}',-1)">−</button><input value="${qty(finalQty(c.id,pid))}" onchange="window.setFinal('${c.id}','${pid}',this.value)"><button onclick="window.bumpFinal('${c.id}','${pid}',1)">+</button></div></div>`).join('');openModal('Reparto final',`<div class="card"><b>${esc(p.name)}</b><div class="muted">Pedido ${qty(req)} · Comprado ${qty(b)}</div></div>${rows}`)}
function bumpFinal(cid,pid,d){data.route.finalDelivered[cid+'__'+pid]=Math.max(0,finalQty(cid,pid)+d);save();showProduct(pid)}
function setFinal(cid,pid,v){data.route.finalDelivered[cid+'__'+pid]=Math.max(0,Number(String(v).replace(',','.'))||0);save();showProduct(pid)}
function renderLoad(){const t=totals(),pending=t.filter(x=>!data.route.loaded[x.p.id]),done=t.filter(x=>data.route.loaded[x.p.id]);$('#load').innerHTML=`<article class="card"><h2>Carga</h2><div class="muted">Pendientes arriba, cargados abajo</div></article><article class="card">${[...pending,...done].map(x=>`<div class="delivery-item ${data.route.loaded[x.p.id]?'checked':''}" onclick="window.toggleLoad('${x.p.id}')"><div class="check">${data.route.loaded[x.p.id]?'✓':''}</div><div><b>${esc(x.p.name)}</b></div><b>${qty(data.route.purchasedQty[x.p.id]??x.q)} ${esc(x.p.unit)}</b></div>`).join('')}</article>`}
function toggleLoad(pid){data.route.loaded[pid]=!data.route.loaded[pid];save()}
function renderDelivery(){const cs=clients().filter(c=>lines(c.id).length>0);$('#delivery').innerHTML=`<article class="card"><div class="section-title"><h2>Reparto</h2><button class="btn primary small" onclick="window.finalReport()">Resumen final</button></div></article>`+cs.map(c=>{const ls=lines(c.id).sort((a,b)=>Number(data.route.delivered[c.id+'__'+a.p.id])-Number(data.route.delivered[c.id+'__'+b.p.id]));return `<article class="card"><h2>${c.routeOrder}. ${esc(c.name)}</h2>${ls.map(x=>{const k=c.id+'__'+x.p.id,ch=!!data.route.delivered[k];return `<div class="delivery-item ${ch?'checked':''}" onclick="window.toggleDelivery('${k}')"><div class="check">${ch?'✓':''}</div><div><b>${esc(x.p.name)}</b></div><b>${qty(finalQty(c.id,x.p.id))} ${esc(x.p.unit)}</b></div>`}).join('')}</article>`}).join('')}
function toggleDelivery(k){data.route.delivered[k]=!data.route.delivered[k];save()}
function finalReport(){const txt=clients().map(c=>{const ls=products().map(p=>({p,q:finalQty(c.id,p.id)})).filter(x=>x.q>0);return ls.length?`CLIENTE: ${c.name}\n`+ls.map(x=>`${x.p.name}: ${qty(x.q)} ${x.p.unit}`).join('\n'):''}).filter(Boolean).join('\n\n----------------\n\n');openModal('Reparto final para facturar',`<textarea style="width:100%;min-height:420px">${esc(txt)}</textarea><button class="btn primary" style="width:100%;margin-top:10px" onclick="navigator.clipboard.writeText(${JSON.stringify(txt)})">Copiar</button>`)}
function openModal(t,b){$('#modalTitle').textContent=t;$('#modalBody').innerHTML=b;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
function addClientForm(){openModal('Añadir cliente',`<input id="nc" class="search" placeholder="Nombre"><input id="no" class="search" style="margin-top:8px" type="number" value="${clients().length+1}"><button class="btn primary" style="width:100%;margin-top:10px" onclick="window.addClient()">Guardar</button>`)}
function addClient(){const n=$('#nc').value.trim().toUpperCase();if(!n)return;const id=uid('c');data.catalog.clients[id]={id,name:n,phone:'',address:'',routeOrder:Number($('#no').value)||clients().length+1,active:true};closeModal();save()}
function addProductForm(){openModal('Añadir producto',`<input id="np" class="search" placeholder="Producto"><select id="nu" class="search" style="margin-top:8px"><option>CAJA</option><option>KG</option><option>UD</option><option>MANOJO</option><option>SACO</option></select><input id="ncat" class="search" style="margin-top:8px" value="Otros"><button class="btn primary" style="width:100%;margin-top:10px" onclick="window.addProduct()">Guardar</button>`)}
function addProduct(){const n=$('#np').value.trim().toUpperCase();if(!n)return;const id=uid('p');data.catalog.products[id]={id,name:n,unit:$('#nu').value,category:$('#ncat').value||'Otros',active:true};closeModal();save()}

function selectClient(id){currentClient=id;render()}
function selectCategory(cat){category=cat;renderOrders()}

function openClient(id){currentClient=id;setView('orders')}

Object.assign(window,{setView,routeReset,filterClients,openClient,render,selectClient,selectCategory,renderOrders,liveProductSearch,bump,setQty,finishClient,setBought,showProduct,bumpFinal,setFinal,toggleLoad,toggleDelivery,finalReport,closeModal,addClientForm,addClient,addProductForm,addProduct});

$$('.nav').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#loginBtn').onclick=()=>signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value).catch(e=>$('#loginMsg').textContent='Correo o contraseña incorrectos');
$('#resetBtn').onclick=()=>sendPasswordResetEmail(auth,$('#email').value.trim()).then(()=>$('#loginMsg').textContent='Correo enviado').catch(()=>$('#loginMsg').textContent='No se pudo enviar');
$('#logoutBtn').onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
 if(!user){$('#login').classList.remove('hidden');cloud('Sesión cerrada');return}
 $('#login').classList.add('hidden');cloud('Conectando','sync');
 onValue(ref(db,`workspaces/${workspaceId}`),snap=>{
  applying=true;
  const remote=snap.val();
  if(remote?.catalog){data=remote}else{
    const local=JSON.parse(localStorage.getItem('rutaMadridV11')||'null');
    if(local)data=local;
  }
  applying=false;seedIfNeeded();cloud('Sincronizado','online');
 },()=>cloud('Sin permiso'));
});
</script>
</body></html>
